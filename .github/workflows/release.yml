name: Verified environment release
run-name: Release ${{ inputs.version || 'current' }} ${{ inputs.request_id || github.sha }}

on:
  push:
    branches: [main]
    paths: [publication.json]
  workflow_dispatch:
    inputs:
      version:
        description: Exact formal version
        required: true
        type: string
      request_id:
        description: Resume correlation identifier
        required: false
        type: string

concurrency:
  group: environment-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test publication failure gates
        shell: pwsh
        run: python -m unittest discover -s .release -p test_pipeline.py -v
      - name: Test real preparation and historical upgrade in isolation
        shell: powershell
        run: |
          $target = if ($env:EXPECTED_VERSION) { $env:EXPECTED_VERSION } else { (Get-Content VERSION.json -Raw | ConvertFrom-Json).version }
          & .\.release\test-preparation-entry.ps1 -SitePath $PWD.Path -ExpectedVersion $target -OutputPath "$env:RUNNER_TEMP/preparation-verification.json"
          if (-not $?) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preparation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation-verification.json
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preparation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification
      - name: Validate publication and preparation evidence
        run: python3 .release/pipeline.py check --report "$RUNNER_TEMP/release-verification/release-verification.json"
      - name: Reconcile tag, draft and verified attachments
        run: python3 .release/pipeline.py prepare --report "$RUNNER_TEMP/release-verification/release-verification.json"
      - name: Stage public files only
        run: python3 .release/pipeline.py stage-pages --report "$RUNNER_TEMP/release-verification/release-verification.json" --destination "$RUNNER_TEMP/public-site"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify actual public file bytes and package versions
        run: python3 .release/pipeline.py verify-pages --report "$RUNNER_TEMP/release-verification/release-verification.json"
      - name: Publish formal release and verify public Latest
        run: python3 .release/pipeline.py finalize --report "$RUNNER_TEMP/release-verification/release-verification.json"
      - name: Save final result in workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-verification/release-verification.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/release-verification/release-verification.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification
          retention-days: 90
          if-no-files-found: error
